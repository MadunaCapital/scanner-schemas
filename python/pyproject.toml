[project]
name = "maduna-scanner-schemas"
version = "0.1.0"
description = "Shared contract types for the MadunaCapital arbitrage scanner"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["schemas*"]
